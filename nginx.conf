server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle /alphabit/ prefix - strip it and serve files
    location /alphabit/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Also handle requests without prefix (for direct container access)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 '{"status":"healthy","app":"alphabit"}';
        add_header Content-Type application/json;
    }
}